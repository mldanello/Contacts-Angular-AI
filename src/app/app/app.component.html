<div class="app-shell">
  <header class="app-header">
    <nav class="app-nav">
      <span class="app-title">MD Management Studio</span>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/contacts" routerLinkActive="active">Contacts</a>
      <button class="nav-action" *ngIf="authService.isAuthenticated(); else loginLink" type="button" (click)="logout()">Logout</button>
      <ng-template #loginLink>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </ng-template>
    </nav>
  </header>
  <main class="app-container">
    <router-outlet></router-outlet>
  </main>
</div>
